              width: 90
              cap: butt
            halo_multiplier: 0
      axis_y:
        title: USD per core-hour (log scale)
        scale:
          domain:
          - 0.01
          - 0.8
      label: USD per core-hour (log scale)
    - type: line
      query: databricks_bar
      x: year_slot
      y: cost
      style:
        marks:
          line:
            curve: linear
            stroke:
              color: '#FF3621'
              width: 90
              cap: butt
            halo_multiplier: 0
      axis_y:
