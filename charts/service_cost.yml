        font:
          case: none
      legend:
        visible: false
      marks:
        point:
          opacity: 0
      axis_y:
        labels:
          format: $.3f
        scale:
          continuous:
            type: log
            domain:
            - 0.01
            - 0.8
          nice: false
      axis_x:
        type: ordinal
        labels:
          visible: false
        title:
          visible: false
        ticks:
          visible: false
        line:
          visible: false
        grid:
          visible: false
        scale:
          padding: 0.65
