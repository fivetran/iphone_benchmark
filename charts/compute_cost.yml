charts:
  cost:
    title: Compute cost
    subtitle: Best observed AWS C-series price-performance, normalized using Geekbench single-core = 1000
    query: frontier
    type: line
    x: date
    y: cost_per_normalized_core_hour
    x_label: Year
    y_label: USD per normalized core-hour (log scale)
    style:
      title:
        font:
          case: none
        subtitle:
          font:
            case: none
      legend:
        visible: false
      marks:
        line:
          curve: step-after
      axis_x:
        type: temporal
        time_unit: none
        labels:
          format: '%Y'
      axis_y:
        labels:
          format: $.3f
        scale:
          continuous:
            type: log
            domain:
            - 0.005
            - 0.1
          nice: false
    layers:
    - type: line
      query: annotation_1
      x: date
      y: cost_per_normalized_core_hour
      style:
        marks:
          line:
            curve: linear
            stroke:
              color: '#888888'
              width: 1
            halo_multiplier: 0
            labels:
              visible: true
              field: annotation_label
              position: top
              font:
                color: '#444444'
          point:
            size: 0
      label: USD per normalized core-hour (log scale)
