source: compute_cost
theme: vivid
notes: Best observed public C-series committed pricing in us-east-1, normalized using physical cores and Geekbench
  6 single-core scores. No volume tiers. Service comparisons are in service_cost.yml.
style:
  footer:
    visible: false
  timestamp:
    visible: false
queries:
  frontier:
    sql: |
      SELECT date, cost_per_normalized_core_hour, instance
      FROM frontier
      UNION ALL
      SELECT '2026-09-30', cost_per_normalized_core_hour, instance
      FROM frontier
      WHERE date = (SELECT max(date) FROM frontier)
      ORDER BY date
  annotation_1:
    notes: Two-point annotation stem; first point is the measured frontier, second is an offset label anchor.
    sql: |-
      SELECT date, cost_per_normalized_core_hour AS cost_per_normalized_core_hour, '' AS annotation_label
      FROM frontier WHERE date = '2013-11-15'
      UNION ALL
      SELECT strftime(CAST(date AS DATE) + INTERVAL '200 days', '%Y-%m-%d'), cost_per_normalized_core_hour * 1.12, instance
      FROM frontier WHERE date = '2013-11-15'
      ORDER BY date
  annotation_2:
    notes: Two-point annotation stem; first point is the measured frontier, second is an offset label anchor.
